<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Any File To MD: documents on one side, clean Markdown on the other</title>
  <defs>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e3dfda"/></pattern>
    <clipPath id="card"><rect x="1" y="1" width="1278" height="438" rx="18"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1l7 4-7 4" stroke="#6d51ac" stroke-width="1.4"/></marker>
  </defs>

  <rect x="1" y="1" width="1278" height="438" rx="18" fill="#f9f5ef" stroke="#e3dfda" stroke-width="2"/>
  <g clip-path="url(#card)">
    <rect x="640" y="0" width="640" height="440" fill="url(#dots)" opacity=".55"/>

    <!-- sparkles -->
    <path d="M118 70h8M122 66v8M1150 84h8M1154 80v8M252 120h6M255 117v6M1032 54h6M1035 51v6M762 52h6M765 49v6M372 46h6M375 43v6" stroke="#b9b4af" stroke-width="1.2"/>
    <path d="M196 98q5 -5 10 0q5 -5 10 0M216 88q4 -4 8 0q4 -4 8 0M1060 116q4.5 -4.5 9 0q4.5 -4.5 9 0M1082 126q3.5 -3.5 7 0q3.5 -3.5 7 0" stroke="#665f59" stroke-width="1.2"/>

    <!-- title -->
    <text x="640" y="92" text-anchor="middle" font-family="'Instrument Serif',Georgia,'Times New Roman',serif" font-size="58" fill="#271e19" letter-spacing="-1.5">Any File To MD</text>
    <text x="640" y="130" text-anchor="middle" font-family="'Instrument Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#665f59">Point at a folder. Get clean Markdown. Nothing leaves your computer.</text>

    <!-- sun behind the ridge -->
    <circle cx="640" cy="432" r="118" stroke="#846e2d" stroke-opacity=".22" stroke-width="1.2" stroke-dasharray="2 6"/>
    <circle cx="640" cy="432" r="92" stroke="#846e2d" stroke-opacity=".3" stroke-width="1.2"/>
    <circle cx="640" cy="432" r="70" fill="#fbe3bf" fill-opacity=".75" stroke="#846e2d" stroke-opacity=".55" stroke-width="1.2"/>

    <!-- left: source documents -->
    <g stroke="#271e19" stroke-width="1.6" fill="#ffffff">
      <g transform="translate(150 196) rotate(-9 40 50)">
        <path d="M0 0h58l22 22v84H0z"/><path d="M58 0v22h22" fill="none"/>
        <path d="M14 36h40M14 48h52M14 60h30M14 72h46M14 84h36" stroke="#908984" stroke-width="1.3" fill="none"/>
        <text x="40" y="128" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" fill="#7b746f" stroke="none">.pdf</text>
      </g>
      <g transform="translate(250 176) rotate(-3 40 50)">
        <path d="M0 0h58l22 22v84H0z"/><path d="M58 0v22h22" fill="none"/>
        <path d="M14 34h34" stroke="#271e19" stroke-width="3" fill="none"/>
        <path d="M14 50h52M14 60h44M14 70h52M14 80h28" stroke="#908984" stroke-width="1.3" fill="none"/>
        <text x="40" y="128" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" fill="#7b746f" stroke="none">.docx</text>
      </g>
      <g transform="translate(350 176) rotate(3 40 50)">
        <path d="M0 0h58l22 22v84H0z"/><path d="M58 0v22h22" fill="none"/>
        <path d="M12 34h56v52H12zM12 47h56M12 60h56M12 73h56M31 34v52M50 34v52" stroke="#3f8a4f" stroke-width="1.2" fill="none"/>
        <text x="40" y="128" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" fill="#7b746f" stroke="none">.xlsx</text>
      </g>
      <g transform="translate(450 196) rotate(9 40 50)">
        <path d="M0 0h58l22 22v84H0z"/><path d="M58 0v22h22" fill="none"/>
        <path d="M12 34h56v38H12z" stroke="#b0152c" stroke-width="1.2" fill="none"/>
        <path d="M22 64v-8M32 64v-16M42 64v-11M52 64v-20" stroke="#b0152c" stroke-width="2" fill="none"/>
        <path d="M14 82h40M14 92h28" stroke="#908984" stroke-width="1.3" fill="none"/>
        <text x="40" y="128" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" fill="#7b746f" stroke="none">.pptx</text>
      </g>
    </g>

    <!-- center: the mirror -->
    <path d="M640 156v196" stroke="#b9b4af" stroke-width="1.4" stroke-dasharray="2 5"/>
    <path d="M548 250C574 250 586 250 592 250" stroke="#6d51ac" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
    <path d="M688 250C700 250 718 250 742 250" stroke="#6d51ac" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
    <circle cx="640" cy="250" r="44" fill="#ffffff" stroke="#271e19" stroke-width="1.6"/>
    <g transform="translate(616 226) scale(1.5)" stroke="#271e19" stroke-width="1.3">
      <path d="M2.75 4.75h7.5l3.5 3.5v19h-11z"/><path d="M10.25 4.75v3.5h3.5"/>
      <path d="M5.25 13.25h5.5M5.25 17h4M5.25 20.75h5.5" stroke-width="1.1"/>
      <path d="M16 2.5v27" stroke-width=".9" stroke-dasharray="1.5 2"/>
      <path d="M29.25 4.75h-7.5l-3.5 3.5v19h11z"/><path d="M21.75 4.75v3.5h-3.5"/>
      <path d="M21.6 13.5l-.9 8M24.6 13.5l-.9 8M20.4 16h5.2M20 19h5.2" stroke="#6d51ac" stroke-width="1.1"/>
    </g>

    <!-- right: Markdown pages -->
    <g stroke="#271e19" stroke-width="1.6" fill="#ffffff">
      <g transform="translate(800 170) rotate(-4 60 60)">
        <path d="M0 0h84l26 26v104H0z"/><path d="M84 0v26h26" fill="none"/>
        <path d="M20 30l-2 16M27 30l-2 16M16 35h12M15 41h12" stroke="#6d51ac" stroke-width="1.6" fill="none"/>
        <path d="M36 38h40" stroke="#271e19" stroke-width="3" fill="none"/>
        <path d="M16 62h76M16 74h62M16 86h70" stroke="#908984" stroke-width="1.3" fill="none"/>
        <path d="M16 100h4M26 100h52M16 112h4M26 112h40" stroke="#6d51ac" stroke-width="1.3" fill="none"/>
      </g>
      <g transform="translate(940 184) rotate(5 60 60)">
        <path d="M0 0h84l26 26v104H0z"/><path d="M84 0v26h26" fill="none"/>
        <path d="M20 30l-2 16M27 30l-2 16M16 35h12M15 41h12" stroke="#6d51ac" stroke-width="1.6" fill="none"/>
        <path d="M36 38h30" stroke="#271e19" stroke-width="3" fill="none"/>
        <path d="M16 58h78v40H16zM16 71h78M16 84h78M42 58v40M68 58v40" stroke="#908984" stroke-width="1.2" fill="none"/>
        <path d="M16 112h70" stroke="#908984" stroke-width="1.3" fill="none"/>
      </g>
      <text x="922" y="342" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" fill="#6d51ac" stroke="none">.md</text>
    </g>

    <!-- front ridge and water -->
    <path d="M0 392 L60 376 L124 386 L196 360 L250 372 L316 354 L386 378 L464 394 L640 402 L810 394 L888 378 L954 352 L1018 368 L1092 346 L1156 364 L1222 352 L1280 362 V440 H0Z" fill="#f9f5ef" stroke="#271e19" stroke-width="1.5"/>
    <path d="M966 355l-3 8M977 358l-3.8 9.5M988 361l-4 10M999 364l-3.8 9.5M1010 367l-3 8M328 358l-3 8M340 362l-3.8 9.5M352 366l-4 10M364 370l-3.8 9.5M376 374l-3 8" stroke="#7b746f" stroke-width="1"/>
    <path d="M520 414h96M664 414h96M550 421h70M660 421h70M578 428h46M656 428h46" stroke="#846e2d" stroke-opacity=".6" stroke-width="1.2"/>
    <path d="M0 420 C130 412 236 424 364 418 S520 410 520 418 M760 418 C820 410 948 424 1076 416 S1220 410 1280 418" stroke="#b9b4af" stroke-width="1.1" stroke-dasharray="3 4"/>
  </g>
</svg>
