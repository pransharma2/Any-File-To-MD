[workspace]
resolver = "2"
members = ["engine", "app", "wasm"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Keep unwinding: a malformed file that panics a parser must not take down the batch.
panic = "unwind"

# The website build: wasm32 has no unwinding, so a parser panic restarts the worker instead.
[profile.wasm]
inherits = "release"
panic = "abort"
opt-level = "s"
