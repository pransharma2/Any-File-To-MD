[workspace]
resolver = "2"
members = ["engine", "app"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Keep unwinding: a malformed file that panics a parser must not take down the batch.
panic = "unwind"
